<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script>
// Cena: mesa de trabalho em luz natural, documentos, caneta e a assinatura dourada da marca.
// Todo movimento é periódico no tempo T para o vídeo repetir sem emenda.
const params = new URLSearchParams(location.search);
const W = +params.get('w') || 1280, H = +params.get('h') || 720;
const T = 10;
const c = document.getElementById('c'); c.width = W; c.height = H;
const g = c.getContext('2d');
const sig = new Image(); sig.src = 'signature-gold.png';
const TAU = Math.PI * 2;
const portrait = H > W;

// gerador determinístico
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const lines = (n) => Array.from({ length: n }, (_, i) => .55 + rnd() * .4);
const sheets = portrait ? [
  { x: .40, y: .55, w: .36, h: .50, r: -.16, tone: '#f6f2ea', lines: lines(14) },
  { x: .72, y: .64, w: .36, h: .50, r: .08, tone: '#fbf9f5', lines: lines(12) },
  { x: .50, y: .69, w: .40, h: .52, r: -.04, tone: '#ffffff', lines: lines(9), signed: true },
] : [
  { x: .70, y: .36, w: .36, h: .50, r: -.16, tone: '#f6f2ea', lines: lines(14) },
  { x: .84, y: .56, w: .36, h: .50, r: .08, tone: '#fbf9f5', lines: lines(12) },
  { x: .67, y: .58, w: .38, h: .52, r: -.04, tone: '#ffffff', lines: lines(9), signed: true },
];
const dust = Array.from({ length: 46 }, () => ({
  x: rnd(), y: rnd(), r: 1 + rnd() * (portrait ? 3 : 4), a: .15 + rnd() * .45,
  ph: rnd() * TAU, amp: .006 + rnd() * .018, k: 1 + Math.floor(rnd() * 2),
}));

function sheet(s, u) {
  const S = portrait ? W * 1.15 : H * 1.02;
  const w = s.w * S, h = s.h * S * 1.29;
  g.save();
  g.translate(s.x * W, s.y * H);
  g.rotate(s.r);
  g.shadowColor = 'rgba(38,41,46,.16)'; g.shadowBlur = S * .05; g.shadowOffsetY = S * .018; g.shadowOffsetX = S * .01;
  g.fillStyle = s.tone; g.fillRect(-w / 2, -h / 2, w, h);
  g.shadowColor = 'transparent';
  // linhas de texto
  const pad = w * .12;
  g.fillStyle = 'rgba(38,41,46,.20)';
  g.fillRect(-w / 2 + pad, -h / 2 + pad, w * .34, h * .012);
  s.lines.forEach((len, i) => {
    const y = -h / 2 + pad + h * .07 + i * h * .045;
    if (s.signed && i > 7) return;
    g.fillStyle = 'rgba(38,41,46,.11)';
    g.fillRect(-w / 2 + pad, y, (w - pad * 2) * (i % 5 === 4 ? len * .6 : len), h * .007);
  });
  if (s.signed) {
    const ly = h / 2 - pad * 1.25;
    g.fillStyle = 'rgba(38,41,46,.28)';
    g.fillRect(-w * .28, ly, w * .56, 1.2);
    g.fillStyle = 'rgba(38,41,46,.18)';
    g.fillRect(-w * .12, ly + h * .02, w * .24, h * .006);
    if (sig.complete) {
      const sw = w * .78, sh = sw * (sig.height / sig.width);
      g.globalAlpha = .96;
      g.drawImage(sig, -sw / 2 + w * .02, ly - sh * .66, sw, sh);
      g.globalAlpha = 1;
    }
  }
  g.restore();
}

function pen(u) {
  const S = portrait ? W : H;
  g.save();
  if (portrait) { g.translate(W * .22, H * .92); g.rotate(-.62); }
  else { g.translate(W * .48, H * .86); g.rotate(-.42); }
  const L = portrait ? W * .62 : H * .62, R = (portrait ? W : H) * .02;
  g.shadowColor = 'rgba(38,41,46,.28)'; g.shadowBlur = S * .03; g.shadowOffsetY = S * .02; g.shadowOffsetX = S * .012;
  const body = g.createLinearGradient(0, -R, 0, R);
  body.addColorStop(0, '#4a4f57'); body.addColorStop(.35, '#2c3036'); body.addColorStop(1, '#16181b');
  g.fillStyle = body;
  g.beginPath(); g.roundRect(-L / 2, -R, L * .84, R * 2, R); g.fill();
  g.shadowColor = 'transparent';
  // anel dourado e clipe
  const gold = g.createLinearGradient(0, -R, 0, R);
  gold.addColorStop(0, '#e9d08a'); gold.addColorStop(.5, '#c9a24a'); gold.addColorStop(1, '#8f6f2e');
  g.fillStyle = gold;
  g.fillRect(-L / 2 + L * .56, -R, L * .035, R * 2);
  g.beginPath(); g.roundRect(-L / 2 + L * .08, -R * 1.25, L * .3, R * .42, R * .2); g.fill();
  // ponta
  g.beginPath(); g.moveTo(-L / 2 + L * .84, -R * .8); g.lineTo(L / 2, 0); g.lineTo(-L / 2 + L * .84, R * .8); g.closePath();
  g.fill();
  // brilho
  g.fillStyle = 'rgba(255,255,255,.16)';
  g.fillRect(-L / 2 + R, -R * .55, L * .78, R * .22);
  g.restore();
}

function frame(t) {
  const u = (t % T) / T;           // 0..1
  const s1 = Math.sin(TAU * u), c1 = Math.cos(TAU * u);

  // fundo: superfície clara da mesa
  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#fbfaf7'); bg.addColorStop(.55, '#f3eee4'); bg.addColorStop(1, '#e8e1d3');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  // câmera: deriva lenta e periódica
  g.save();
  const zoom = 1.06 + .025 * (1 - c1) / 2;
  g.translate(W / 2, H / 2);
  g.scale(zoom, zoom);
  g.rotate(.012 * s1);
  g.translate(-W / 2 + W * .012 * s1, -H / 2 + H * .01 * c1);

  sheets.forEach((s) => sheet(s, u));
  pen(u);
  g.restore();

  // luz da janela: faixas diagonais suaves que passam devagar
  g.save();
  g.globalCompositeOperation = 'multiply';
  const off = (u * 2 % 1) * W * .5;
  g.translate(W * .5, H * .5); g.rotate(-.5); g.translate(-W, -H);
  for (let i = -2; i < 8; i++) {
    const x = i * W * .25 + off;
    const lg = g.createLinearGradient(x, 0, x + W * .25, 0);
    lg.addColorStop(0, 'rgba(120,100,70,0)');
    lg.addColorStop(.45, 'rgba(120,100,70,.10)');
    lg.addColorStop(.55, 'rgba(120,100,70,.10)');
    lg.addColorStop(1, 'rgba(120,100,70,0)');
    g.fillStyle = lg; g.fillRect(x, 0, W * .25, H * 3);
  }
  g.restore();

  // reflexo quente vindo da janela
  const glow = g.createRadialGradient(W * .18, H * .08, 0, W * .18, H * .08, Math.max(W, H) * .8);
  glow.addColorStop(0, `rgba(255,244,214,${.55 + .1 * s1})`); glow.addColorStop(1, 'rgba(255,244,214,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, H);

  // poeira dourada em suspensão
  dust.forEach((d) => {
    const x = (d.x + d.amp * Math.sin(TAU * u * d.k + d.ph)) * W;
    const y = (d.y + d.amp * 1.4 * Math.cos(TAU * u * d.k + d.ph)) * H;
    const a = d.a * (.6 + .4 * Math.sin(TAU * u * d.k + d.ph * 2));
    const rg = g.createRadialGradient(x, y, 0, x, y, d.r * 2.2);
    rg.addColorStop(0, `rgba(214,180,100,${a})`); rg.addColorStop(1, 'rgba(214,180,100,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, d.r * 2.2, 0, TAU); g.fill();
  });

  // vinheta leve
  const vg = g.createRadialGradient(W * .6, H * .55, Math.min(W, H) * .3, W * .6, H * .55, Math.max(W, H) * .85);
  vg.addColorStop(0, 'rgba(38,41,46,0)'); vg.addColorStop(1, 'rgba(38,41,46,.10)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
}
window.frame = frame;
window.ready = new Promise((r) => { sig.onload = r; if (sig.complete) r(); });
</script>
</body></html>
